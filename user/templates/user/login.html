{%extends "blog/base.html"%}

  {%block content%}
    <div id="login" class="container">
        
      {%if messages%}
      
        <div id="message">
            
            {%for message in messages%}
               <p>{{message}}</p>
               
            {%endfor%}
               
        </div>
      {%endif%}
      
      <form method="POST">
    
        {%csrf_token%}
        <legend>Login </legend>
        
        <div id = "form">
          {{form}}
        </div>
        
        <div>
            
          <button type="submit">signin</button>
        </div>
        <a class= "but" href="{%url 'password_reset'%}">forgot password</a>
      </form>
      
      <small>don't have an account? <a href="{%url 'user-signup'%}">signup</a></small>
    </div>
    
  {%endblock content%}
