{%extends "blog/base.html"%}

  {%block content%}
    <div id="login" class="container">
        
      {%if messages%}
      
        <div id="message">
            
            {%for message in messages%}
               <p>{{message}}</p>
               
            {%endfor%}
               
        </div>
      {%endif%}
      
      <form method="POST">
    
        {%csrf_token%}
        <legend>Reset Password</legend>
        
        <div id = "form">
          {{form}}
        </div>
        
        <div>
            
          <button class="butt" type="submit">Reset Password</button>
        </div>
        
      </form>
    </div>
    
  {%endblock content%}
